<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    
    <!-- SEO & Meta Tags -->
    <title>R2 Nusantara | Gudang Distributor Rokok Grosir Malang</title>
    <meta name="description" content="Distributor rokok resmi Malang. 230+ merek ready stock. Bayar setelah resi keluar, gratis ongkir min 1 bal.">
    <meta name="keywords" content="distributor rokok malang, grosir rokok, R2 Nusantara, rokok resmi">
    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="https://r2nusantara.com/">

    <!-- Open Graph / Social -->
    <meta property="og:title" content="R2 Nusantara — Distributor Rokok Grosir Premium">
    <meta property="og:description" content="Gudang distributor resmi. Bayar setelah resi keluar. Gratis ongkir min 1 bal.">
    <meta property="og:image" content="assets/logo/logo-resmi.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/logo/logo-resmi.png">

    <!-- Fonts & Icons (Preloaded for Performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/plus-jakarta-sans" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">

    <!-- Tailwind CSS (CDN for now, can be built locally later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Modular CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-300 antialiased">

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 glass-header border-b border-slate-200/50 transition-all">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group">
                <img src="assets/logo/logo-resmi.png" alt="Logo R2" class="w-10 h-10 rounded-full shadow-sm transform group-hover:scale-105 transition-transform" loading="lazy">
                <div>
                    <h1 class="font-extrabold text-sm md:text-base premium-text tracking-tight uppercase">R2 Nusantara</h1>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">B2B Wholesale</span>
                </div>
            </a>

            <div class="flex items-center gap-4">
                <!-- Dark Mode Toggle -->
                <button id="themeToggle" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors" aria-label="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                
                <!-- Desktop Cart Button -->
                <button onclick="CartModule.toggleCart()" class="hidden md:flex items-center gap-2 bg-brand-primary text-white px-5 py-2 rounded-full hover:shadow-lg hover:-translate-y-0.5 transition-all">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="text-sm font-bold">Keranjang</span>
                    <span id="cartBadgeDesktop" class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="pt-24 pb-24 md:pb-10">
        <!-- KATALOG SECTION -->
        <section id="katalog" class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="text-3xl font-extrabold text-slate-900 dark-text">Katalog Grosir</h2>
                
                <!-- Search & Filter Bar -->
                <div class="w-full md:w-auto flex gap-2">
                    <div class="relative w-full md:w-64">
                        <input type="text" id="searchInput" placeholder="Cari merek..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-primary outline-none text-sm transition-shadow bg-white dark-input">
                        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    </div>
                </div>
            </div>

            <!-- Grid Produk -->
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Produk di-render melalui JavaScript -->
            </div>
        </section>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION (Khusus Layar Kecil) -->
    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-50 pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center h-16 px-2">
            <a href="#beranda" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary active-nav">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-bold">Beranda</span>
            </a>
            <a href="#katalog" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary">
                <i class="fa-solid fa-box-open text-lg"></i>
                <span class="text-[10px] font-bold">Katalog</span>
            </a>
            <button onclick="CartModule.toggleCart()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary relative">
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadgeMobile" class="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </div>
                <span class="text-[10px] font-bold">Pesanan</span>
            </button>
            <a href="#akun" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-primary">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-bold">Admin</span>
            </a>
        </div>
    </nav>

    <!-- SIDEBAR KERANJANG -->
    <div id="cartOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity" onclick="CartModule.toggleCart()"></div>
    <div id="cartSidebar" class="fixed top-0 right-0 h-full w-full md:w-[400px] bg-white z-[70] transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col dark-sidebar">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="font-extrabold text-lg flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-brand-primary"></i> Draft Pesanan</h3>
            <button onclick="CartModule.toggleCart()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Item Keranjang di-render di sini -->
        </div>
        <div class="p-4 border-t border-slate-100 bg-slate-50 dark-bg-footer">
            <div class="flex justify-between items-end mb-4">
                <span class="text-xs font-bold text-slate-500 uppercase">Total Tagihan</span>
                <span id="cartTotal" class="text-2xl font-black text-brand-primary font-mono">Rp 0</span>
            </div>
            <button class="w-full bg-brand-primary text-white font-bold py-3.5 rounded-xl hover:shadow-lg transition-all flex justify-center items-center gap-2">
                Checkout Sekarang <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Modular Scripts -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
